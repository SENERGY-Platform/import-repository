basePath: /
definitions:
  model.ImportRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  model.ImportType:
    properties:
      configs:
        items:
          $ref: '#/definitions/models.ImportTypeConfig'
        type: array
      cost:
        type: integer
      default_restart:
        type: boolean
      description:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
      output:
        $ref: '#/definitions/models.ImportContentVariable'
      owner:
        type: string
    type: object
  model.InUseResponse:
    properties:
      error:
        type: string
      import_instances:
        type: integer
      readable_imports:
        items:
          $ref: '#/definitions/model.ImportRef'
        type: array
      readable_releases:
        items:
          $ref: '#/definitions/model.ReleaseRef'
        type: array
      release_instances:
        type: integer
      releases:
        type: integer
    type: object
  model.OwnerCommand:
    properties:
      owner:
        type: string
    type: object
  model.ReleaseRef:
    properties:
      design_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.ImportContentVariable:
    properties:
      aspect_id:
        description: 'deprecated: please use AspectIds'
        type: string
      aspect_ids:
        items:
          type: string
        type: array
      characteristic_id:
        type: string
      function_id:
        type: string
      name:
        type: string
      sub_content_variables:
        items:
          $ref: '#/definitions/models.ImportContentVariable'
        type: array
      type:
        $ref: '#/definitions/models.Type'
      use_as_tag:
        type: boolean
    type: object
  models.ImportTypeConfig:
    properties:
      default_value: {}
      description:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/models.Type'
    type: object
  models.Type:
    enum:
    - https://schema.org/Text
    - https://schema.org/Integer
    - https://schema.org/Float
    - https://schema.org/Boolean
    - https://schema.org/ItemList
    - https://schema.org/StructuredValue
    type: string
    x-enum-varnames:
    - String
    - Integer
    - Float
    - Boolean
    - List
    - Structure
info:
  contact: {}
  description: Repository to store metadata about import types.
  title: Import Repository API
paths:
  /doc:
    get:
      description: Returns the generated Swagger document for this service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get OpenAPI document
      tags:
      - documentation
  /import-types:
    get:
      description: Returns import types visible to the caller. If `ids` is provided,
        pagination is ignored.
      parameters:
      - default: 100
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Result offset
        in: query
        name: offset
        type: integer
      - description: Comma-separated import type ids
        in: query
        name: ids
        type: string
      - description: JSON-encoded filter criteria array
        in: query
        name: criteria
        type: string
      - default: false
        description: Combine the aspect_ids of a criteria with AND instead of OR;
          every named aspect has to be carried by the same content variable and covers
          its aspect subtree
        in: query
        name: and_combine_criteria_aspect_ids
        type: boolean
      - description: Free-text search term
        in: query
        name: search
        type: string
      - default: name.asc
        description: Sort order
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Total number of matching import types
              type: integer
          schema:
            items:
              $ref: '#/definitions/model.ImportType'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: List import types
      tags:
      - import-types
    post:
      consumes:
      - application/json
      description: Creates a new import type.
      parameters:
      - description: Import type payload
        in: body
        name: importType
        required: true
        schema:
          $ref: '#/definitions/model.ImportType'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ImportType'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: Create import type
      tags:
      - import-types
  /import-types/{id}:
    delete:
      description: Deletes an import type by id. Refused with 409 while smart service
        releases or import instances use it, unless an administrator passes force.
        Answers 502 when the smart service repository or import-deploy cannot be asked,
        also with force; nothing is deleted then.
      parameters:
      - description: Import type id
        in: path
        name: id
        required: true
        type: string
      - default: false
        description: 'Administrators only: delete although the import type is still
          used'
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.InUseResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
      security:
      - Bearer: []
      summary: Delete import type
      tags:
      - import-types
    get:
      description: Returns a single import type by id.
      parameters:
      - description: Import type id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ImportType'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: Get import type
      tags:
      - import-types
    put:
      consumes:
      - application/json
      description: Replaces an import type. The request body id must match the path
        id.
      parameters:
      - description: Import type id
        in: path
        name: id
        required: true
        type: string
      - description: Full import type payload
        in: body
        name: importType
        required: true
        schema:
          $ref: '#/definitions/model.ImportType'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: Update import type
      tags:
      - import-types
  /import-types/{id}/owner:
    put:
      consumes:
      - application/json
      description: Administrators only. Gives the user every right on the import type
        in permissions-v2, keeps all other permission entries, then sets the stored
        owner; no other field changes and the id stays. Repeating the request completes
        a move that failed halfway.
      parameters:
      - description: Import type id
        in: path
        name: id
        required: true
        type: string
      - description: New owner
        in: body
        name: owner
        required: true
        schema:
          $ref: '#/definitions/model.OwnerCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ImportType'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: Move import type to another owner
      tags:
      - import-types
  /users/{id}:
    delete:
      description: Administrators only; user-management calls this while deleting
        a user. Deletes the import types the user administers alone and removes the
        user's permissions from all others. Does not check whether smart services
        or import instances still use the import types.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: Delete user
      tags:
      - users
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
